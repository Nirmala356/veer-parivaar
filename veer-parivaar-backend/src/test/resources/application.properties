spring.application.name=veer-parivaar-backend-test

# Isolated in-memory H2 database for test execution
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate settings for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT configuration (256-bit secret)
app.jwt.expiration-ms=86400000
app.jwt.secret=test-only-secret-not-for-production-0123456789abcdef

# Test upload directory
app.upload.dir=${java.io.tmpdir}/veer-parivaar-test-uploads
