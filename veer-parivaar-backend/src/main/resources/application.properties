spring.application.name=veer-parivaar-backend
server.port=${PORT:8080}
# MySQL database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/veer_parivaar}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# JWT configuration
app.jwt.expiration-ms=86400000
app.jwt.secret=${JWT_SECRET}

# Local document storage (outside the source tree)
app.upload.dir=${UPLOAD_DIR:${user.home}/.veer-parivaar/uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB